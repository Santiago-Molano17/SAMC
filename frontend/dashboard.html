<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SACM Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->

    <div class="sidebar bg-dark text-white p-3">

        <h3 class="mb-4">
            SACM
        </h3>

        <ul class="nav flex-column" id="sidebarMenu">

        </ul>

    </div>

    <!-- MAIN -->

    <div class="main-content w-100">

        <!-- NAVBAR -->

        <nav class="navbar navbar-light bg-white shadow-sm px-4">

            <h4>
                Dashboard
            </h4>

            <div>

                <span id="username"></span>

            </div>

        </nav>

        <!-- CONTENT -->

        <div class="container-fluid p-4">

            <!-- CARDS -->

            <div class="row">

                <div class="col-md-3">

                    <div class="card shadow p-3 mb-4">

                        <h5>
                            Malware Detected
                        </h5>

                        <h2 id="totalAnalysis"></h2>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow p-3 mb-4">

                        <h5>
                            Users
                        </h5>

                        <h2 id="totalUsers"></h2>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow p-3 mb-4">

                        <h5>
                            Reports
                        </h5>

                        <h2 id="totalReports"></h2>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow p-3 mb-4">

                        <h5>
                            Critical Risk
                        </h5>

                        <h2
                            class="text-danger"
                            id="criticalRisk"
                        ></h2>

                    </div>

                </div>

            </div>

            <!-- UPLOAD -->

            <div class="card shadow mt-4 p-4">

                <h4 class="mb-4">
                    Upload File
                </h4>

                <form id="uploadForm">

                    <input
                        type="file"
                        class="form-control mb-3"
                        id="file"
                        required
                    >

                    <button class="btn btn-primary">

                        Analyze File

                    </button>

                </form>

            </div>

            <!-- CHART -->

            <div class="row mt-4">

                <div class="col-md-8">

                    <div class="card shadow p-4">

                        <h4 class="mb-4">
                            Malware Statistics
                        </h4>

                        <canvas id="malwareChart"></canvas>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow p-4">

                        <h4 class="mb-4">
                            User Information
                        </h4>

                        <p>
                            Role:
                            <strong id="role"></strong>
                        </p>

                        <p>
                            System:
                            Protected
                        </p>

                        <p>
                            Security:
                            Active
                        </p>

                    </div>

                </div>

            </div>

            <!-- TABLE -->

            <div class="card shadow mt-4 p-4">

                <h4 class="mb-4">
                    Recent Malware Analysis
                </h4>

                <table class="table table-striped">

                    <thead>

                        <tr>
                            <th>File</th>
                            <th>Type</th>
                            <th>Risk</th>
                            <th>Date</th>
                        </tr>

                    </thead>

                    <tbody id="analysisTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="./js/dashboard.js"></script>

</body>
</html>
